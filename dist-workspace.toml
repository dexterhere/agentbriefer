[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Actually publish the npm package to the registry (not just build it)
publish-jobs = ["npm"]
# "skillforge" and "skillforge-cli" are both already taken by unrelated
# packages, and the unscoped "skill-forge-cli" was rejected by npm's
# anti-squatting check as too similar to "skillforge-cli". Scoping to the
# GitHub/npm username avoids collision entirely, regardless of similarity.
npm-scope = "@dexterhere"
npm-package = "skillforge"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
