[package]
name = "skill-forge-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Configure how AI coding agents think, code, test, and stop inside your project."
repository = "https://github.com/dexterhere/skillforge"

[[bin]]
name = "skillforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
figlet-rs = "0.2"
owo-colors = "4.3.0"
rust-embed = "8.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
tera = "2.0.0"
thiserror = "2.0.18"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
