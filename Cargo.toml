[package]
name = "agentbriefer"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Configure how AI coding agents think, code, test, and stop inside your project."
repository = "https://github.com/dexterhere/agentbriefer"

[[bin]]
name = "agentbriefer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
figlet-rs = "0.2"
owo-colors = "4.3.0"
regex = "1.12.4"
roxmltree = "0.21.1"
rust-embed = "8.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
tera = "2.0.0"
thiserror = "2.0.18"
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
